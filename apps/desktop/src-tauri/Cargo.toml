[package]
name = "cursorbuddy-desktop"
version = "0.1.0"
description = "Cursorbuddy AI Desktop Companion"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
tauri-plugin-store = "2"
tauri-plugin-notification = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-process = "2"
tauri-plugin-opener = "2"
tauri-plugin-os = "2"
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"

# Keyboard & Screen
rdev = "0.5"
xcap = "0.5"

# Audio Capture & Playback
cpal = "0.15"
rubato = "0.15"
hound = "3.5"
rodio = { version = "0.19", default-features = false, features = ["symphonia-mp3", "wav"] }

# Image Processing
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
imageproc = "0.25"

# Networking & Async
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "multipart"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"

# Serialization & Error Handling
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
once_cell = "1"
parking_lot = "0.12"
keyring = "3"

# Clipboard & Typing
arboard = "3"
enigo = "0.2"

# Platform Specific
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    "Win32_UI_Accessibility",
    "Win32_Graphics_Gdi"
] }
uiautomation = "0.6"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-app-kit = "0.2"
objc2-foundation = "0.2"
accessibility = "0.1"
accessibility-sys = "0.1"
core-graphics = "0.23"
